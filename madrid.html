let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }

function apiUrl(action) {
  return `${CONFIG.API_URL}?action=${action}&trip=${encodeURIComponent(CONFIG.TRIP_ID)}`;
}

async function loadState() {
  if (!CONFIG.API_URL) { state.isLoaded = true; state.syncStatus = "error"; state.syncError = "Aucune URL Apps Script configurée."; render(); return; }
  try {
    const res = await fetch(apiUrl("get"), { method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.checkedStops = data.checkedStops || {};
    state.checkedChecklist = data.checkedChecklist || {};
    state.customLinks = data.customLinks || {};
    state.stopNotes = data.stopNotes || {};
    state.customPlaces = data.customPlaces || [];
    state.isLoaded = true;
    state.syncStatus = "saved";
  } catch (err) {
    state.isLoaded = true;
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

async function saveState() {
  if (!CONFIG.API_URL) return;
  state.syncStatus = "saving";
  render();
  try {
    const res = await fetch(apiUrl("set"), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ checkedStops: state.checkedStops, checkedChecklist: state.checkedChecklist, customLinks: state.customLinks, customPlaces: state.customPlaces, stopNotes: state.stopNotes }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.syncStatus = data && data.ok ? "saved" : "error";
    state.syncError = data && data.ok ? "" : "Réponse inattendue du serveur.";
  } catch (err) {
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

function resetProgress() {
  state.checkedStops = {};
  state.checkedChecklist = {};
  saveState();
}

function addLink(key, prefill) {
  const existing = state.customLinks[key] || prefill || "";
  const url = window.prompt("Colle le lien de réservation :", existing);
  if (url === null) return; // annulé
  if (url.trim() === "") {
    delete state.customLinks[key];
  } else {
    state.customLinks[key] = url.trim();
  }
  render();
  scheduleSave();
}

function addNote(key) {
  const existing = state.stopNotes[key] || "";
  const note = window.prompt("Ta note personnelle :", existing);
  if (note === null) return; // annulé
  if (note.trim() === "") {
    delete state.stopNotes[key];
  } else {
    state.stopNotes[key] = note.trim();
  }
  render();
  scheduleSave();
}

function addPlace() {
  const name = window.prompt("Nom du resto :");
  if (!name || !name.trim()) return;
  const ville = window.prompt("Ville :", "") || "";
  const note = window.prompt("Note (optionnel) :", "") || "";
  const link = window.prompt("Lien (site, réservation... optionnel) :", "") || "";
  state.customPlaces.push({ id: "cp" + Date.now(), name: name.trim(), ville: ville.trim(), note: note.trim(), link: link.trim() });
  render();
  scheduleSave();
}

function editPlace(id) {
  const p = state.customPlaces.find(x => x.id === id);
  if (!p) return;
  const name = window.prompt("Nom du resto :", p.name);
  if (name === null) return; // annulé
  if (!name.trim()) return;
  const ville = window.prompt("Ville :", p.ville || "");
  if (ville === null) return;
  const note = window.prompt("Note (optionnel) :", p.note || "");
  if (note === null) return;
  const link = window.prompt("Lien (site, réservation... optionnel) :", p.link || "");
  if (link === null) return;
  p.name = name.trim();
  p.ville = ville.trim();
  p.note = note.trim();
  p.link = link.trim();
  render();
  scheduleSave();
}

function deletePlace(id) {
  state.customPlaces = state.customPlaces.filter(p => p.id !== id);
  render();
  scheduleSave();
}

function removeCustomLink(key) {
  delete state.customLinks[key];
  render();
  scheduleSave();
}

function removeStopNote(key) {
  delete state.stopNotes[key];
  render();
  scheduleSave();
}

function stopLabelFromKey(key) {
  const [dayId, idx] = key.split("-").map(Number);
  const day = DAYS.find(d => d.id === dayId);
  if (!day || !day.stops[idx]) return key;
  return day.stops[idx].title;
}

function renderCustomItemsList() {
  const places = state.customPlaces || [];
  const links = Object.entries(state.customLinks || {});
  const notes = Object.entries(state.stopNotes || {});
  if (places.length === 0 && links.length === 0 && notes.length === 0) {
    return `<p class="text-xs text-[#F5E8DE]/55">Aucun élément personnalisé pour l'instant — les restos, liens et notes que vous ajoutez apparaîtront ici, chacun avec son propre bouton de suppression.</p>`;
  }
  return `
    <div class="space-y-2">
      ${places.map(p => `
        <div class="flex items-center justify-between gap-3 rounded-md border px-3 py-2" style="border-color:#2E1A20;background:#1A1013">
          <div class="min-w-0">
            <p class="text-xs font-semibold flex items-center gap-1.5">${icon("utensils",11)}${p.name}</p>
            <p class="text-[10px] text-[#F5E8DE]/55 mt-0.5">${p.ville || ""}</p>
          </div>
          <button data-delplace="${p.id}" class="delplace-btn shrink-0" style="color:#8A7A78">${icon("x",14)}</button>
        </div>
      `).join("")}
      ${links.map(([key, url]) => `
        <div class="flex items-center justify-between gap-3 rounded-md border px-3 py-2" style="border-color:#2E1A20;background:#1A1013">
          <div class="min-w-0">

          </div>
          <button data-rmlink="${key}" class="rmlink-btn shrink-0" style="color:#8A7A78">${icon("x",14)}</button>

      ${notes.map(([key, note]) => `
        <div class="flex items-center justify-between gap-3 rounded-md border px-3 py-2" style="border-color:#2E1A20;background:#1A1013">
          <div class="min-w-0">

        </div>
      `).join("")}
    </div>
  `;

function icon(name, size, extraClass) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${extraClass||''} shrink-0"></i>`;
}
function mapsLink(query) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
function wazeLink(query) {
  return `https://www.waze.com/ul?q=${encodeURIComponent(query)}&navigate=yes`;
}
function linkChip(href, label, iconName) {
  return `<a href="${href}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-1 rounded-full" style="background:#1A1013;color:#F5E8DE" onclick="event.stopPropagation()">${icon(iconName,10)}${label}</a>`;
}
function countdown() {
  const target = new Date("2027-06-18T06:00:00");
  const diffMs = target - state.now;
  if (diffMs <= 0) return { live: true };
  const days = Math.floor(diffMs / 86400000);
  return { live: false, days };
}

function renderLieux() {
  const cats = ["Toutes","Monument","Jardin","Mirador","Tapas"];
  const allPlaces = [...PLACES, ...state.customPlaces.map(p => ({ ...p, category: "Tapas", custom: true }))];
  const filtered = state.placeFilter==="Toutes" ? allPlaces : allPlaces.filter(p => p.category===state.placeFilter);
  return `
    <button id="btn-addplace" class="w-full flex items-center justify-center gap-2 text-xs font-semibold rounded-full py-2 mb-4 border border-dashed" style="border-color:#3A1F26;color:#F5E8DE">
      ${icon("plus",14)}Ajouter un resto
    </button>
    <div class="flex items-center gap-2 mb-4 overflow-x-auto no-scrollbar pb-1">
      ${icon("filter",14,"text-[#F5E8DE]/60")}
      ${cats.map(cat => {
        const active = state.placeFilter===cat;
        const color = PLACE_CATEGORY_COLORS[cat];
        return `
          <button data-placefilter="${cat}" class="placefilter-btn shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border" style="border-color:${active?'#F5E8DE':'#3A1F26'};background:${active?'#F5E8DE':'transparent'};color:${active?'#1A1013':'#F5E8DE'}">
            ${color ? `<span class="w-2 h-2 rounded-full" style="background:${active?'#1A1013':color}"></span>` : ""}${cat}
          </button>
        `;
      }).join("")}
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      ${filtered.map(p => `
        <div class="flex items-start gap-3 rounded-lg border px-4 py-3" style="border-color:#2E1A20;background:#241318">
          <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0" style="background:${PLACE_CATEGORY_COLORS[p.category]}"></span>
          <div class="min-w-0 flex-1">
            <p class="font-semibold text-sm">${p.name}</p>
            <p class="text-[#F5E8DE]/60 text-xs flex items-center gap-1 mt-0.5">${icon("map-pin",11)}${p.ville}</p>
            ${p.note ? `<p class="text-[#F5E8DE]/70 text-xs mt-1">${p.note}</p>` : ""}
            <div class="flex items-center gap-2 mt-2 flex-wrap">
              <span class="text-[10px] uppercase tracking-wide font-bold" style="color:${PLACE_CATEGORY_COLORS[p.category]}">${p.category}</span>
              ${p.custom ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background:#2E1A20;color:#C9972C">${icon("user",10)} Ajouté par vous</span>` : ""}
              ${linkChip(mapsLink(p.name + ", " + p.ville), "Maps", "map-pin")}
              ${linkChip(wazeLink(p.name + ", " + p.ville), "Waze", "navigation")}
              ${p.custom && p.link ? linkChip(p.link, "Lien", "external-link") : ""}
            </div>
          </div>
          ${p.custom ? `
            <div class="flex flex-col gap-1 shrink-0">
              <button data-editplace="${p.id}" style="color:#8A7A78" class="editplace-btn">${icon("pencil",13)}</button>
              <button data-delplace="${p.id}" style="color:#8A7A78" class="delplace-btn">${icon("x",14)}</button>
            </div>
          ` : ""}
        </div>
      `).join("")}
    </div>
  `;
}

function renderInfos() {

          <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:#1A1013">${icon(info.icon,15,"text-[#C9972C]")}</div>
          <div class="min-w-0">

            <p class="text-[#F5E8DE]/70 text-sm">${info.texte}</p>

}

function renderExperiences() {
  return `
    <div class="space-y-4">
      ${EXPERIENCES.map(r => {
        const savedLink = state.customLinks[r.name];
        return `
        <div class="rounded-lg border overflow-hidden" style="border-color:#2E1A20;background:#241318">
          <div class="h-1.5" style="background:${r.color}"></div>
          <div class="p-4">
            <div class="flex items-center justify-between gap-2 mb-1">
              <h3 class="font-display font-black text-lg">${r.name}</h3>
            </div>
            <p class="text-xs text-[#F5E8DE]/70 flex items-center gap-3 mb-3">
              <span class="flex items-center gap-1">${icon("clock",12)}${r.when}</span>
              <span class="flex items-center gap-1">${icon("map-pin",12)}${r.ville}</span>
            </p>
            <p class="text-sm text-[#F5E8DE]/80 mb-3">${r.desc}</p>
            <div class="flex items-center gap-2 text-xs rounded-md px-3 py-2 mb-3" style="background:#1A1013">${icon("ticket",13,"text-[#F5E8DE]/65")}<span style="color:#C9972C">${r.booking}</span></div>
            <div class="flex items-center gap-2 flex-wrap">
              ${linkChip(mapsLink(r.name + ", " + r.ville), "Maps", "map-pin")}
              ${savedLink ? linkChip(savedLink, "Lien", "external-link") : ""}
              <button data-addlink="${r.name}" data-prefill="" class="addlink-btn inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-1 rounded-full border" style="border-color:#3A1F26;color:#F5E8DE">
                ${icon(savedLink ? "pencil" : "plus",10)}${savedLink ? "Modifier le lien" : "Ajouter le lien"}
              </button>
            </div>
          </div>
        </div>
      `;
      }).join("")}
    </div>
  `;
}

// ---------------------------------------------------------------
// EVENTS
// ---------------------------------------------------------------
function attachEvents() {
  document.querySelectorAll(".tab-btn").forEach(btn => { btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); }; });
  document.querySelectorAll(".day-btn").forEach(btn => { btn.onclick = () => { state.activeDay = Number(btn.dataset.day); render(); }; });
  document.querySelectorAll(".stop-btn").forEach(btn => {
    btn.onclick = () => { const key = btn.dataset.stop; state.checkedStops[key] = !state.checkedStops[key]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".check-btn").forEach(btn => {
    btn.onclick = () => { const id = btn.dataset.check; state.checkedChecklist[id] = !state.checkedChecklist[id]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".placefilter-btn").forEach(btn => {
    btn.onclick = () => { state.placeFilter = btn.dataset.placefilter; render(); };
  });
  document.querySelectorAll(".addlink-btn").forEach(btn => {
    btn.onclick = () => { addLink(btn.dataset.addlink, btn.dataset.prefill); };
  });
  document.querySelectorAll(".addnote-btn").forEach(btn => {
    btn.onclick = () => { addNote(btn.dataset.addnote); };
  });
  document.querySelectorAll(".delplace-btn").forEach(btn => {
    btn.onclick = () => { deletePlace(btn.dataset.delplace); };
  });
  document.querySelectorAll(".editplace-btn").forEach(btn => {
    btn.onclick = () => { editPlace(btn.dataset.editplace); };
  });
  document.querySelectorAll(".rmlink-btn").forEach(btn => {
    btn.onclick = () => { removeCustomLink(btn.dataset.rmlink); };
  });
  document.querySelectorAll(".rmnote-btn").forEach(btn => {
    btn.onclick = () => { removeStopNote(btn.dataset.rmnote); };
  });
  const addPlaceBtn = document.getElementById("btn-addplace");
  if (addPlaceBtn) addPlaceBtn.onclick = addPlace;
  const retryBtn = document.getElementById("btn-retry");
  if (retryBtn) retryBtn.onclick = saveState;
  const resetBtn = document.getElementById("btn-reset");
  if (resetBtn) resetBtn.onclick = resetProgress;
  const shareBtn = document.getElementById("btn-share");
  if (shareBtn) shareBtn.onclick = shareApp;
}

async function shareApp() {
  const shareData = {
    title: "Madrid — Carnet de voyage",
    text: "Notre carnet de voyage à Madrid",
    url: window.location.href,
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (err) { /* annulé par l'utilisateur */ }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(shareData.url);
      window.alert("Lien copié dans le presse-papier !");
    } catch (err) {
      window.prompt("Copie ce lien :", shareData.url);
    }
  } else {
    window.prompt("Copie ce lien :", shareData.url);
  }
}

// ---------------------------------------------------------------
// INIT
// ---------------------------------------------------------------
function jumpToToday() {
  const tripStart = new Date("2027-06-18T00:00:00");
  const diffDays = Math.floor((state.now - tripStart) / 86400000) + 1;
  if (diffDays >= 1 && diffDays <= DAYS.length) {
    state.activeDay = diffDays;
    state.activeTab = "itineraire";
  }
}

jumpToToday();
setInterval(() => { state.now = new Date(); render(); }, 60000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

render();
loadState();
</script>
