const state = {
  activeTab: "itineraire",
  activeDay: 1,
  checkedStops: {},
  checkedRes: {},
  customPlaces: [],
  customLinks: {},
  placeFilter: "Toutes",
  isLoaded: false,
  syncStatus: "idle", // idle | saving | saved | error
  syncError: "",
  now: new Date(),
};

let saveTimer = null;

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}

async function loadState() {
  if (!CONFIG.API_URL || CONFIG.API_URL.includes("COLLE_ICI")) {
    state.isLoaded = true;
    state.syncStatus = "error";
    state.syncError = "Aucune URL Apps Script configurée (CONFIG.API_URL).";
    render();
    return;
  }
  try {
    const res = await fetch(CONFIG.API_URL + "?action=get", { method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.checkedStops = data.checkedStops || {};
    state.checkedRes = data.checkedRes || {};
    state.customPlaces = data.customPlaces || [];
    state.customLinks = data.customLinks || {};
    state.isLoaded = true;
    state.syncStatus = "saved";
  } catch (err) {
    state.isLoaded = true;
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

async function saveState() {
  if (!CONFIG.API_URL || CONFIG.API_URL.includes("COLLE_ICI")) return;
  state.syncStatus = "saving";
  render();
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      // text/plain évite le pre-flight CORS (OPTIONS) qu'Apps Script ne gère pas nativement
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ checkedStops: state.checkedStops, checkedRes: state.checkedRes, customPlaces: state.customPlaces, customLinks: state.customLinks }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.syncStatus = data && data.ok ? "saved" : "error";
    state.syncError = data && data.ok ? "" : "Réponse inattendue du serveur.";
  } catch (err) {
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

function resetProgress() {
  state.checkedStops = {};
  state.checkedRes = {};
  saveState();
}

function addLink(key, prefill) {
  const existing = state.customLinks[key] || prefill || "";
  const url = window.prompt("Colle le lien de réservation :", existing);
  if (url === null) return; // annulé
  if (url.trim() === "") {
    delete state.customLinks[key];
  } else {
    state.customLinks[key] = url.trim();
  }
  render();
  scheduleSave();
}

function addPlace() {
  const name = window.prompt("Nom du resto :");
  if (!name || !name.trim()) return;
  const quartier = window.prompt("Quartier :", "") || "";
  const note = window.prompt("Note (optionnel) :", "") || "";
  const link = window.prompt("Lien (site, réservation... optionnel) :", "") || "";
  state.customPlaces.push({ id: "cp" + Date.now(), name: name.trim(), quartier: quartier.trim(), note: note.trim(), link: link.trim() });
  render();
  scheduleSave();
}

function editPlace(id) {
  const p = state.customPlaces.find(x => x.id === id);
  if (!p) return;
  const name = window.prompt("Nom du resto :", p.name);
  if (name === null) return; // annulé
  if (!name.trim()) return;
  const quartier = window.prompt("Quartier :", p.quartier || "");
  if (quartier === null) return;
  const note = window.prompt("Note (optionnel) :", p.note || "");
  if (note === null) return;
  const link = window.prompt("Lien (site, réservation... optionnel) :", p.link || "");
  if (link === null) return;
  p.name = name.trim();
  p.quartier = quartier.trim();
  p.note = note.trim();
  p.link = link.trim();
  render();
  scheduleSave();
}

function deletePlace(id) {
  state.customPlaces = state.customPlaces.filter(p => p.id !== id);
  render();
  scheduleSave();
}

function icon(name, size, extraClass) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${extraClass||''} shrink-0"></i>`;
}
function mapsLink(query) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
function wazeLink(query) {
  return `https://www.waze.com/ul?q=${encodeURIComponent(query)}&navigate=yes`;
}
function linkChip(href, label, iconName) {
  return `<a href="${href}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-1 rounded-full bg-zinc-800 text-zinc-200" onclick="event.stopPropagation()">${icon(iconName,10)}${label}</a>`;
}

function countdown() {
  const target = new Date("2027-05-01T00:00:00");
  const diffMs = target - state.now;
  if (diffMs <= 0) return { live: true };
  const days = Math.floor(diffMs / 86400000);
  return { live: false, days };
}

function resProgress() {
  const total = RESERVATIONS.length;
  const done = Object.values(state.checkedRes).filter(Boolean).length;
  return { total, done, pct: Math.round((done/total)*100) };
}

function renderItineraire() {
  const day = DAYS.find(d => d.id === state.activeDay);
  return `
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1 mb-6">
      ${DAYS.map(d => {
        const done = d.stops.filter((_,i) => state.checkedStops[`${d.id}-${i}`]).length;
        const active = state.activeDay === d.id;
        return `
          <button data-day="${d.id}" class="day-btn shrink-0 w-20 rounded-lg border px-2 py-2 text-center transition-colors ${active ? "border-white bg-zinc-900" : "border-zinc-800"}" style="background:${active ? '' : '#18181b'}">
            <div class="w-6 h-6 rounded-full mx-auto mb-1 flex items-center justify-center text-[10px] font-black text-black" style="background:${d.color}">${d.id}</div>
            <p class="text-[10px] uppercase font-bold text-zinc-400">${d.weekday}</p>
            <p class="text-xs font-mono text-zinc-500">${done}/${d.stops.length}</p>
          </button>
        `;
      }).join("")}
    </div>

    <div class="flex items-center gap-3 mb-1">
      <span class="w-3 h-3 rounded-full shrink-0" style="background:${day.color}"></span>
      <h2 class="uppercase font-black text-2xl tracking-tight">${day.weekday} ${day.date}</h2>
    </div>
    <p class="text-zinc-500 text-sm mb-6 ml-6">${day.quartier}</p>

    <div class="relative pl-8">
      <div class="absolute left-[11px] top-2 bottom-2 w-[3px] rounded-full" style="background:${day.color};opacity:0.35"></div>
      <div class="space-y-4">
        ${day.stops.map((s, idx) => {
          const key = `${day.id}-${idx}`;
          const done = !!state.checkedStops[key];
          return `
            <div class="relative">
              <button data-stop="${key}" class="stop-btn absolute -left-8 top-1 w-6 h-6 rounded-full border-2 flex items-center justify-center bg-neutral-950" style="border-color:${day.color}">
                ${done ? icon("check-circle-2",16) : `<span style="width:8px;height:8px;border-radius:9999px;background:${day.color}"></span>`}
              </button>
              <div class="rounded-lg border px-4 py-3 ${done ? "border-zinc-800 opacity-50" : "border-zinc-800 bg-zinc-900"}" style="background:${done ? '#0a0a0a' : ''}">
                <span class="font-mono text-xs font-bold text-zinc-400 flex items-center gap-1 mb-1">${icon("clock",12)}${s.time}</span>
                ${s.loc
                  ? `<a href="${wazeLink(s.loc)}" target="_blank" rel="noopener" class="font-semibold text-sm inline-flex items-center gap-1.5 text-white ${done ? "line-through" : ""}">${s.title}${icon("navigation",12,"text-yellow-400")}</a>`
                  : `<p class="font-semibold text-sm ${done ? "line-through" : ""}">${s.title}</p>`}
                <p class="text-zinc-400 text-xs mt-1">${s.desc}</p>
                ${s.tip ? `<p class="flex items-start gap-1.5 text-[11px] text-yellow-400/90 mt-2">${icon("camera",12,"mt-0.5")}${s.tip}</p>` : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------
// EVENTS
// ---------------------------------------------------------------
function attachEvents() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); };
  });
  document.querySelectorAll(".day-btn").forEach(btn => {
    btn.onclick = () => { state.activeDay = Number(btn.dataset.day); render(); };
  });
  document.querySelectorAll(".stop-btn").forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.stop;
      state.checkedStops[key] = !state.checkedStops[key];
      render();
      scheduleSave();
    };
  });
  document.querySelectorAll(".res-btn").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.res;
      state.checkedRes[id] = !state.checkedRes[id];
      render();
      scheduleSave();
    };
  });
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => { state.placeFilter = btn.dataset.filter; render(); };
  });
  document.querySelectorAll(".delplace-btn").forEach(btn => {
    btn.onclick = () => { deletePlace(btn.dataset.delplace); };
  });
  document.querySelectorAll(".editplace-btn").forEach(btn => {
    btn.onclick = () => { editPlace(btn.dataset.editplace); };
  });
  document.querySelectorAll(".addlink-btn").forEach(btn => {
    btn.onclick = () => { addLink(btn.dataset.addlink, btn.dataset.prefill); };
  });
  const addPlaceBtn = document.getElementById("btn-addplace");
  if (addPlaceBtn) addPlaceBtn.onclick = addPlace;
  const retryBtn = document.getElementById("btn-retry");
  if (retryBtn) retryBtn.onclick = saveState;
  const resetBtn = document.getElementById("btn-reset");
  if (resetBtn) resetBtn.onclick = resetProgress;
  const shareBtn = document.getElementById("btn-share");
  if (shareBtn) shareBtn.onclick = shareApp;
}

async function shareApp() {
  const shareData = {
    title: "New York — Carnet de voyage",
    text: "Notre carnet de voyage à New York",
    url: window.location.href,
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (err) { /* annulé par l'utilisateur */ }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(shareData.url);
      window.alert("Lien copié dans le presse-papier !");
    } catch (err) {
      window.prompt("Copie ce lien :", shareData.url);
    }
  } else {
    window.prompt("Copie ce lien :", shareData.url);
  }
}
