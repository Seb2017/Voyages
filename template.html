<!-- ============================================================
     GABARIT — CARNET DE VOYAGE
     ============================================================
     Comment créer un nouveau carnet à partir de ce fichier :

     1. Dupliquer ce fichier → renommer en "nom-du-voyage.html"
        (minuscules, tirets, sans accents — ex: "portugal.html")

     2. Personnaliser ci-dessous, dans l'ordre :
        - <title> et les balises meta (apple-mobile-web-app-title, theme-color)
        - Les 2 icônes SVG en data-URI (rel="apple-touch-icon" et rel="icon") :
          changer le code couleur %23XXXXXX et le texte 2-4 lettres dans <text>
        - CONFIG.TRIP_ID (identifiant court, unique, sans espace)
        - La police Google Fonts si tu veux un style différent
        - La couleur de fond (variable --bg utilisée partout dans <style>)

     3. Ajouter ce voyage à la barre de nav EN HAUT de CE fichier,
        ET dans TOUS les autres carnets déjà en ligne (index.html,
        andalousie.html, ouest-americain.html, etc.) — sinon on ne
        peut naviguer que dans un sens.

     4. Remplir les données (section DATA, un peu plus bas) :
        - LEG : une couleur par étape/ville du voyage
        - TRIP_START : date ISO du 1er jour si connue, sinon `null`
          (la météo + le bandeau de départ + les rappels mail restent
          inactifs tant que c'est `null` — rien ne casse)
        - COORDS : lat/lon de chaque ville étape (cherche sur Google
          Maps, clic droit → les coordonnées s'affichent)
        - DAYS : un objet par jour, avec tags d'activité pour les
          alertes météo (voir la légende juste au-dessus du tableau)
        - STAGES, PLACES, CHECKLIST_PRATIQUE, INFOS_PRATIQUES,
          EXPERIENCES (optionnel) : suivre l'exemple fourni

     5. Une fois en ligne, ajouter une entrée dans TRIPS_REMINDERS
        côté Apps Script (Code.gs) pour activer le mail de rappel
        J-10/J-3 sur ce nouveau voyage.

     6. Tout le reste (moteur météo, alertes, bandeau de départ,
        bouton sauvegarde, checklist, ajout de lieux/notes/liens,
        synchro, mode hors-ligne) fonctionne déjà — rien à toucher
        dans le code plus bas que la section DATA, sauf besoin
        spécifique à ce voyage.
     ============================================================ -->

<script>
// =================================================================
// DATA — SECTION À PERSONNALISER POUR CHAQUE NOUVEAU VOYAGE
// Tout ce qui suit jusqu'au marqueur "FIN DE LA SECTION DATA" est
// spécifique au voyage. Le reste du fichier (moteur météo, rendu,
// synchro, etc.) est générique et ne devrait pas avoir besoin
// d'être modifié.
// =================================================================

// Une couleur par étape/ville — utilisée pour les pastilles, bordures, etc.
const LEG = {
  etape1: "#C1502E",
  etape2: "#1B6B93",
  etape3: "#C9972C",
};

// Dates du voyage. Format ISO "AAAA-MM-JJTHH:MM:SS".
// Laisser `null` si les dates ne sont pas encore fixées : la météo,
// le bandeau de départ et les rappels mail restent inactifs tant
// que c'est le cas, sans rien casser.
const TRIP_START = null; // ex: "2027-06-18T00:00:00"

// Coordonnées lat/lon par ville étape (pour la météo).
// Astuce : clic droit sur un point dans Google Maps → les
// coordonnées s'affichent en haut du menu contextuel.
const COORDS = {
  etape1: {lat:0, lon:0},
  etape2: {lat:0, lon:0},
  etape3: {lat:0, lon:0},
};

// Tags d'activité par jour — utilisés par le moteur d'alertes météo
// pour savoir quoi surveiller ce jour-là. Combinables librement :
//   "exterieur" → alerte si pluie ≥60%
//   "marche"    → alerte pluie/chaleur adaptée à la randonnée
//   "plage"     → alerte fraîcheur matinale
//   "surf"      → alerte vent fort
//   "bateau"    → alerte vent fort (sortie en mer/rivière)
//   []          → journée neutre (transport, jour libre...), pas d'alerte

const DAYS = [
  // ---- EXEMPLE — dupliquer ce bloc pour chaque jour du voyage ----
  { id:1, date:"1 JAN", weekday:"VENDREDI", ville:"Arrivée — Étape 1", color:LEG.etape1,
    hotel:"Nom de l'hôtel, Étape 1", coords:COORDS.etape1, tags:["exterieur"], stops:[
    {time:"10:00", title:"Arrivée / transfert", desc:"Description courte de l'étape.", tip:"Astuce optionnelle pour ce moment.", loc:"Nom du lieu pour Waze/Maps"},
    {time:"14:00", title:"Check-in hôtel", desc:"Nom de l'hôtel, ville.", tip:null, loc:"Nom de l'hôtel, ville"},
  ]},
  { id:2, date:"2 JAN", weekday:"SAMEDI", ville:"Étape 1", color:LEG.etape1,
    hotel:"Nom de l'hôtel, Étape 1", coords:COORDS.etape1, tags:["exterieur","marche"], stops:[
    {time:"09:00", title:"Visite guidée", desc:"Description de l'activité.", tip:"Astuce photo ou pratique.", loc:"Lieu de la visite"},
  ]},
  // ---- fin de l'exemple — continuer id:3, id:4... pour tout le séjour ----
];

// Étapes/hébergements — un résumé par ville, affiché dans l'onglet
// "Étapes & hôtels".
const STAGES = [
  {ville:"Étape 1", dates:"1 → 2 janv.", logement:"Nom de l'hôtel", color:LEG.etape1},
  {ville:"Étape 2", dates:"2 → 3 janv.", logement:"Nom de l'hôtel", color:LEG.etape2},
];

// Récapitulatif des réservations, groupé par catégorie — affiché
// dans l'onglet "Réservations", au-dessus de la checklist pratique.
const RESERVATIONS_RECAP = [
  {cat:"Vols", items:[
    {label:"Aller — Compagnie XXX", note:"Détails du vol, date, heure"},
  ]},
  {cat:"Hébergements", items: STAGES.map(s => ({label: s.ville, note: `${s.logement} (${s.dates})`}))},
];

// Checklist des derniers préparatifs avant le départ — c'est ce
// tableau que lit le script Apps Script pour composer le mail de
// rappel (comptage ET libellés). Garder le format {id, label} exact.
const CHECKLIST_PRATIQUE = [
  {id:"c1", label:"Exemple : vérifier les billets/vouchers"},
  {id:"c2", label:"Exemple : préparer les documents de voyage"},
];

// Expériences/activités mises en avant (optionnel) — si le voyage
// n'a pas d'activités à part ça, ce tableau peut rester vide []
// et l'onglet correspondant peut être retiré de TABS plus bas.
const EXPERIENCES = [
  {name:"Nom de l'activité", when:"Samedi 2 janv., 09h00", ville:"Étape 1", color:LEG.etape1,
   desc:"Description de l'activité.", booking:"Réservé — plateforme"},
];

// Catégories de lieux + couleur associée (onglet "Lieux clés").
const PLACE_CATEGORY_COLORS = {
  Monument: "#C9972C",
  Vue: "#1B6B93",
  Plage: "#2A7F7E",
  Gastro: "#8C2F39",
};

const PLACES = [
  {name:"Nom du lieu", ville:"Étape 1", category:"Monument"},
  {name:"Nom du resto", ville:"Étape 1", category:"Gastro", note:"Recommandation locale.", badge:"Avis locaux"},
];

// Encarts d'infos pratiques — l'icône vient de la bibliothèque Lucide
// (https://lucide.dev/icons), chercher le nom en minuscules-tirets.
const INFOS_PRATIQUES = [
  {icon:"siren", titre:"Urgences", texte:"Numéro d'urgence local, adresse du consulat le plus proche."},
  {icon:"plug", titre:"Électricité", texte:"Type de prise, tension, besoin d'un adaptateur ou non."},
  {icon:"wifi-off", titre:"Rappel — carnet hors-ligne", texte:"Ce carnet reste consultable sans réseau une fois mis en cache. Recharger en wifi la veille du départ."},
];

const TABS = [
  {id:"itineraire", label:"Itinéraire", icon:"calendar"},
  {id:"etapes", label:"Étapes & hôtels", icon:"map"},
  {id:"lieux", label:"Lieux clés", icon:"landmark"},
  {id:"reservations", label:"Réservations", icon:"ticket"},
  {id:"experiences", label:"Expériences", icon:"sparkles"}, // retirer si EXPERIENCES est vide
  {id:"infos", label:"Infos pratiques", icon:"info"},
];

// =================================================================
// FIN DE LA SECTION DATA — le reste du fichier est générique.
// =================================================================

// ---------------------------------------------------------------
// STATE
// ---------------------------------------------------------------
const state = {
  activeTab: "itineraire",
  activeDay: 1,
  checkedStops: {},
  checkedChecklist: {},
  customLinks: {},
  stopNotes: {},
  customPlaces: [],
  placeFilter: "Toutes",
  weather: {},
  isLoaded: false,
  syncStatus: "idle",
  syncError: "",
  now: new Date(),
};

let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }

function apiUrl(action) {
  return `${CONFIG.API_URL}?action=${action}&trip=${encodeURIComponent(CONFIG.TRIP_ID)}`;
}

// ---------------------------------------------------------------
// MÉTÉO (Open-Meteo — gratuit, sans clé, ~16 jours de prévision)
// Reste inactif tant que TRIP_START est null.
// IMPORTANT : le fichier sw.js partagé doit laisser passer les
// requêtes vers open-meteo.com (déjà fait si tu réutilises le sw.js
// du reste du projet — ne pas le régénérer depuis zéro).
// ---------------------------------------------------------------
function dayISODate(day) {
  if (!TRIP_START) return null;
  const d = new Date(TRIP_START);
  d.setDate(d.getDate() + (day.id - 1));
  return d.toISOString().slice(0, 10);
}

const WEATHER_CODES = {
  0:  {icon:"sun",           label:"Ciel dégagé"},
  1:  {icon:"cloud-sun",     label:"Peu nuageux"},
  2:  {icon:"cloud-sun",     label:"Partiellement nuageux"},
  3:  {icon:"cloud",         label:"Couvert"},
  45: {icon:"cloud-fog",     label:"Brouillard"},
  48: {icon:"cloud-fog",     label:"Brouillard givrant"},
  51: {icon:"cloud-drizzle", label:"Bruine légère"},
  53: {icon:"cloud-drizzle", label:"Bruine"},
  55: {icon:"cloud-drizzle", label:"Bruine forte"},
  61: {icon:"cloud-rain",    label:"Pluie légère"},
  63: {icon:"cloud-rain",    label:"Pluie"},
  65: {icon:"cloud-rain",    label:"Pluie forte"},
  71: {icon:"cloud-snow",    label:"Neige légère"},
  73: {icon:"cloud-snow",    label:"Neige"},
  75: {icon:"cloud-snow",    label:"Neige forte"},
  80: {icon:"cloud-rain",    label:"Averses"},
  81: {icon:"cloud-rain",    label:"Averses fortes"},
  82: {icon:"cloud-rain",    label:"Averses violentes"},
  95: {icon:"cloud-lightning", label:"Orage"},
  96: {icon:"cloud-lightning", label:"Orage avec grêle"},
  99: {icon:"cloud-lightning", label:"Orage violent"},
};
function weatherInfo(code) {
  return WEATHER_CODES[code] || {icon:"cloud", label:"—"};
}

async function fetchWeatherJson(url, alreadyRetried) {
  const res = await fetch(url);
  if (res.status === 429 && !alreadyRetried) {
    await new Promise(r => setTimeout(r, 2000));
    return fetchWeatherJson(url, true);
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function loadWeather() {
  if (!TRIP_START) return; // dates pas encore fixées — infrastructure prête, en attente
  // Regroupe les jours par lieu identique pour ne faire qu'UN appel API
  // par ville plutôt qu'un appel par jour — réduit le risque de 429
  // (limite de débit d'Open-Meteo en cas de rafale de requêtes).
  const groups = {};
  DAYS.filter(d => d.coords).forEach(d => {
    const key = `${d.coords.lat},${d.coords.lon}`;
    if (!groups[key]) groups[key] = { coords: d.coords, days: [] };
    groups[key].days.push(d);
    state.weather[d.id] = { status: "loading" };
  });
  render();

  await Promise.all(Object.values(groups).map(async group => {
    const dates = group.days.map(d => dayISODate(d)).filter(Boolean).sort();
    if (!dates.length) return;
    const startDate = dates[0];
    const endDate = dates[dates.length - 1];
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${group.coords.lat}&longitude=${group.coords.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max&timezone=auto&start_date=${startDate}&end_date=${endDate}`;
      const data = await fetchWeatherJson(url, false);
      group.days.forEach(day => {
        const dateISO = dayISODate(day);
        const idx = data.daily && data.daily.time ? data.daily.time.indexOf(dateISO) : -1;
        if (idx === -1) {
          state.weather[day.id] = { status: "unavailable" };
        } else {
          state.weather[day.id] = {
            status: "ok",
            code: data.daily.weathercode[idx],
            tmax: Math.round(data.daily.temperature_2m_max[idx]),
            tmin: Math.round(data.daily.temperature_2m_min[idx]),
            rainProb: data.daily.precipitation_probability_max[idx],
            windMax: Math.round(data.daily.windspeed_10m_max[idx]),
          };
        }
      });
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      group.days.forEach(day => { state.weather[day.id] = { status: "error", errorMsg: msg }; });
    }
    render();
  }));
}

// Règles d'alerte : croise la météo du jour avec les tags d'activité du jour.
// Ajuster les seuils ici si un voyage a des besoins particuliers.
function weatherAlerts(day, w) {
  if (!w || w.status !== "ok") return [];
  const tags = day.tags || [];
  const alerts = [];
  if (w.rainProb >= 60 && tags.includes("exterieur")) {
    alerts.push(`Pluie probable (${w.rainProb}%) — journée avec visites en extérieur`);
  } else if (w.rainProb >= 60 && tags.includes("marche")) {
    alerts.push(`Pluie probable (${w.rainProb}%) — prévoir des chaussures adaptées`);
  } else if (w.rainProb >= 75) {
    alerts.push(`Forte probabilité de pluie (${w.rainProb}%)`);
  }
  if (w.windMax >= 40 && tags.includes("surf")) {
    alerts.push(`Vent fort annoncé (${w.windMax} km/h) — vérifier auprès du moniteur`);
  }
  if (w.windMax >= 40 && tags.includes("bateau")) {
    alerts.push(`Vent fort annoncé (${w.windMax} km/h) — vérifier le maintien de la sortie`);
  }
  if (w.tmax >= 36 && tags.includes("marche")) {
    alerts.push(`Chaleur importante (${w.tmax}°C) — prévoir de l'eau, éviter les heures chaudes`);
  } else if (w.tmax >= 38) {
    alerts.push(`Chaleur extrême (${w.tmax}°C)`);
  }
  if (w.tmin <= 12 && tags.includes("plage")) {
    alerts.push(`Températures fraîches (${w.tmin}°C le matin) — prévoir une tenue chaude`);
  }
  return alerts;
}

function renderWeather(day) {
  if (!day.coords) return "";
  if (!TRIP_START) {
    return `<div class="ml-6 mb-4 flex items-center gap-2 text-xs text-[#F1E9DC]/50">${icon("calendar-clock",12)}Météo disponible dès que les dates du voyage seront fixées</div>`;
  }
  const w = state.weather[day.id];
  if (!w || w.status === "loading") {
    return `<div class="ml-6 mb-4 flex items-center gap-2 text-xs text-[#F1E9DC]/50">${icon("loader-circle",12,"animate-spin")}Chargement météo…</div>`;
  }
  if (w.status === "unavailable") {
    return `<div class="ml-6 mb-4 flex items-center gap-2 text-xs text-[#F1E9DC]/50">${icon("calendar-clock",12)}Prévision pas encore disponible (visible à partir de J-16)</div>`;
  }
  if (w.status === "error") {
    return `<div class="ml-6 mb-4 flex flex-col gap-1 text-xs" style="color:#C15060">
      <span class="flex items-center gap-2">${icon("cloud-off",12)}Météo indisponible</span>
      ${w.errorMsg ? `<span class="font-mono text-[10px] opacity-75 break-all">${w.errorMsg}</span>` : ""}
    </div>`;
  }
  const info = weatherInfo(w.code);
  const alerts = weatherAlerts(day, w);
  return `
    <div class="ml-6 mb-4">
      <div class="inline-flex flex-wrap items-center gap-x-3 gap-y-1 rounded-lg border px-3 py-2 text-xs" style="border-color:#2E241B;background:#241C15">
        ${icon(info.icon,18,"text-[#C9972C]")}
        <span class="font-semibold">${info.label}</span>
        <span class="text-[#F1E9DC]/70">${w.tmin}° / ${w.tmax}°C</span>
        <span class="flex items-center gap-1 text-[#F1E9DC]/70">${icon("droplets",11)}${w.rainProb}%</span>
        <span class="flex items-center gap-1 text-[#F1E9DC]/70">${icon("wind",11)}${w.windMax} km/h</span>
      </div>
      ${alerts.map(a => `
        <div class="mt-2 flex items-start gap-2 rounded-lg px-3 py-2 text-xs font-semibold" style="background:#3A2A14;color:#F0B054;border:1px solid #5A3E1E">
          ${icon("triangle-alert",14,"mt-0.5 shrink-0")}<span>${a}</span>
        </div>
      `).join("")}
    </div>
  `;
}

// Mini badge météo compact utilisé dans le sélecteur de jour (aperçu multi-jours).
function miniWeather(day) {
  if (!day.coords || !TRIP_START) return "";
  const w = state.weather[day.id];
  if (!w || w.status === "loading") {
    return `<div class="mt-1 flex items-center justify-center">${icon("loader-circle",11,"animate-spin text-[#F1E9DC]/40")}</div>`;
  }
  if (w.status === "unavailable" || w.status === "error") {
    return `<div class="mt-1 flex items-center justify-center">${icon("minus",11,"text-[#F1E9DC]/30")}</div>`;
  }
  const info = weatherInfo(w.code);
  const hasAlert = weatherAlerts(day, w).length > 0;
  return `
    <div class="mt-1 flex items-center justify-center gap-0.5 relative">
      ${icon(info.icon,13,"text-[#C9972C]")}
      <span class="text-[9px] font-mono text-[#F1E9DC]/60">${w.tmax}°</span>
      ${hasAlert ? `<span style="width:5px;height:5px;border-radius:9999px;background:#F0B054;position:absolute;top:-3px;right:-2px"></span>` : ""}
    </div>
  `;
}

// ---------------------------------------------------------------
// COMPTE À REBOURS + BANDEAU DE DÉPART
// ---------------------------------------------------------------
function countdown() {
  if (!TRIP_START) return { unknown: true };
  const target = new Date(TRIP_START);
  const diffMs = target - state.now;
  if (diffMs <= 0) return { live: true };
  const days = Math.floor(diffMs / 86400000);
  return { live: false, days };
}

// Visible à J-10, plus marqué à J-3, tant qu'il reste des éléments
// non cochés dans la checklist pratique.
function renderDepartureBanner() {
  const cd = countdown();
  if (cd.unknown || cd.live || cd.days > 10) return "";
  const total = CHECKLIST_PRATIQUE.length;
  const done = Object.values(state.checkedChecklist).filter(Boolean).length;
  const remaining = total - done;
  if (remaining <= 0) return "";
  const urgent = cd.days <= 3;
  return `
    <button data-tab="reservations" class="tab-btn w-full flex items-center gap-2 px-4 py-2.5 text-xs font-semibold text-left" style="background:${urgent ? '#3A1E1E' : '#3A2A14'};color:${urgent ? '#F0806B' : '#F0B054'}">
      ${icon("triangle-alert",14,"shrink-0")}

// ---------------------------------------------------------------
// SYNCHRO (Apps Script)
// ---------------------------------------------------------------
async function loadState() {
  if (!CONFIG.API_URL) { state.isLoaded = true; state.syncStatus = "error"; state.syncError = "Aucune URL Apps Script configurée."; render(); return; }
  try {
    const res = await fetch(apiUrl("get"), { method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.checkedStops = data.checkedStops || {};
    state.checkedChecklist = data.checkedChecklist || {};
    state.customLinks = data.customLinks || {};
    state.stopNotes = data.stopNotes || {};
    state.customPlaces = data.customPlaces || [];
    state.isLoaded = true;
    state.syncStatus = "saved";
  } catch (err) {
    state.isLoaded = true;
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

async function saveState() {
  if (!CONFIG.API_URL) return;
  state.syncStatus = "saving";
  render();
  try {
    const res = await fetch(apiUrl("set"), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ checkedStops: state.checkedStops, checkedChecklist: state.checkedChecklist, customLinks: state.customLinks, customPlaces: state.customPlaces, stopNotes: state.stopNotes }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.syncStatus = data && data.ok ? "saved" : "error";
    state.syncError = data && data.ok ? "" : "Réponse inattendue du serveur.";
  } catch (err) {
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

function resetProgress() {
  state.checkedStops = {};
  state.checkedChecklist = {};
  saveState();
}

function exportBackup() {
  const backup = {
    trip: CONFIG.TRIP_ID,
    exportedAt: new Date().toISOString(),
    checkedStops: state.checkedStops,
    checkedChecklist: state.checkedChecklist,
    customLinks: state.customLinks,
    customPlaces: state.customPlaces,
    stopNotes: state.stopNotes,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${CONFIG.TRIP_ID}-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function addLink(key, prefill) {
  const existing = state.customLinks[key] || prefill || "";
  const url = window.prompt("Colle le lien de réservation :", existing);
  if (url === null) return;
  if (url.trim() === "") { delete state.customLinks[key]; } else { state.customLinks[key] = url.trim(); }
  render();
  scheduleSave();
}

function addNote(key) {
  const existing = state.stopNotes[key] || "";
  const note = window.prompt("Ta note personnelle :", existing);
  if (note === null) return;
  if (note.trim() === "") { delete state.stopNotes[key]; } else { state.stopNotes[key] = note.trim(); }
  render();
  scheduleSave();
}

function addPlace() {
  const name = window.prompt("Nom du lieu :");
  if (!name || !name.trim()) return;
  const ville = window.prompt("Ville :", "") || "";
  const note = window.prompt("Note (optionnel) :", "") || "";
  const link = window.prompt("Lien (optionnel) :", "") || "";
  state.customPlaces.push({ id: "cp" + Date.now(), name: name.trim(), ville: ville.trim(), note: note.trim(), link: link.trim() });
  render();
  scheduleSave();
}

function editPlace(id) {
  const p = state.customPlaces.find(x => x.id === id);
  if (!p) return;
  const name = window.prompt("Nom du lieu :", p.name);
  if (name === null || !name.trim()) return;
  const ville = window.prompt("Ville :", p.ville || "");
  if (ville === null) return;
  const note = window.prompt("Note (optionnel) :", p.note || "");
  if (note === null) return;
  const link = window.prompt("Lien (optionnel) :", p.link || "");
  if (link === null) return;
  p.name = name.trim(); p.ville = ville.trim(); p.note = note.trim(); p.link = link.trim();
  render();
  scheduleSave();
}

function deletePlace(id) {
  state.customPlaces = state.customPlaces.filter(p => p.id !== id);
  render();
  scheduleSave();
}

        <div class="flex items-start gap-3 rounded-lg border px-4 py-3" style="border-color:#2E241B;background:#241C15">
          <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0" style="background:${PLACE_CATEGORY_COLORS[p.category]}"></span>
          <div class="min-w-0 flex-1">
            <p class="font-semibold text-sm">${p.name}</p>
            <p class="text-[#F1E9DC]/60 text-xs flex items-center gap-1 mt-0.5">${icon("map-pin",11)}${p.ville}</p>
            ${p.note ? `<p class="text-[#F1E9DC]/70 text-xs mt-1">${p.note}</p>` : ""}
            <div class="flex items-center gap-2 mt-2 flex-wrap">
              <span class="text-[10px] uppercase tracking-wide font-bold" style="color:${PLACE_CATEGORY_COLORS[p.category]}">${p.category}</span>
              ${p.badge ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background:#2A3A1E;color:#9FD671">${icon("thumbs-up",10)} ${p.badge}</span>` : ""}
              ${p.custom ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background:#2E241B;color:#C9972C">${icon("user",10)} Ajouté par vous</span>` : ""}
              ${linkChip(mapsLink(p.name + ", " + p.ville), "Maps", "map-pin")}
              ${p.custom && p.link ? linkChip(p.link, "Lien", "external-link") : ""}
            </div>
          </div>
          ${p.custom ? `
            <div class="flex flex-col gap-1 shrink-0">
              <button data-editplace="${p.id}" style="color:#8A7A6A" class="editplace-btn">${icon("pencil",13)}</button>
              <button data-delplace="${p.id}" style="color:#8A7A6A" class="delplace-btn">${icon("x",14)}</button>
            </div>
          ` : ""}
        </div>
      `).join("")}
    </div>
  `;
}

function renderInfos() {
  return `
    <div class="space-y-3">
      ${INFOS_PRATIQUES.map(info => `
        <div class="flex items-start gap-3 rounded-lg border px-4 py-3" style="border-color:#2E241B;background:#241C15">
          <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:#1C1712">${icon(info.icon,15,"text-[#C9972C]")}</div>
          <div class="min-w-0">
            <p class="font-display font-bold text-base mb-1">${info.titre}</p>
            <p class="text-[#F1E9DC]/70 text-sm">${info.texte}</p>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

// ---------------------------------------------------------------
// EVENTS
// ---------------------------------------------------------------
function attachEvents() {
  document.querySelectorAll(".tab-btn").forEach(btn => { btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); }; });
  document.querySelectorAll(".day-btn").forEach(btn => { btn.onclick = () => { state.activeDay = Number(btn.dataset.day); render(); }; });
  document.querySelectorAll(".stop-btn").forEach(btn => {
    btn.onclick = () => { const key = btn.dataset.stop; state.checkedStops[key] = !state.checkedStops[key]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".check-btn").forEach(btn => {
    btn.onclick = () => { const id = btn.dataset.check; state.checkedChecklist[id] = !state.checkedChecklist[id]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".placefilter-btn").forEach(btn => {
    btn.onclick = () => { state.placeFilter = btn.dataset.placefilter; render(); };
  });
  document.querySelectorAll(".addlink-btn").forEach(btn => {
    btn.onclick = () => { addLink(btn.dataset.addlink, btn.dataset.prefill); };
  });
  document.querySelectorAll(".addnote-btn").forEach(btn => {
    btn.onclick = () => { addNote(btn.dataset.addnote); };
  });
  document.querySelectorAll(".delplace-btn").forEach(btn => {
    btn.onclick = () => { deletePlace(btn.dataset.delplace); };
  });
  document.querySelectorAll(".editplace-btn").forEach(btn => {
    btn.onclick = () => { editPlace(btn.dataset.editplace); };
  });
  const addPlaceBtn = document.getElementById("btn-addplace");
  if (addPlaceBtn) addPlaceBtn.onclick = addPlace;
  const retryBtn = document.getElementById("btn-retry");
  if (retryBtn) retryBtn.onclick = saveState;
  const resetBtn = document.getElementById("btn-reset");
  if (resetBtn) resetBtn.onclick = resetProgress;
  const shareBtn = document.getElementById("btn-share");
  if (shareBtn) shareBtn.onclick = shareApp;
  const backupBtn = document.getElementById("btn-backup");
  if (backupBtn) backupBtn.onclick = exportBackup;
}

async function shareApp() {
  const shareData = {
    title: "NOM_VOYAGE — Carnet de voyage",
    text: "Notre carnet de voyage",
    url: window.location.href,
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (err) { /* annulé par l'utilisateur */ }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(shareData.url);
      window.alert("Lien copié dans le presse-papier !");
    } catch (err) {
      window.prompt("Copie ce lien :", shareData.url);
    }
  } else {
    window.prompt("Copie ce lien :", shareData.url);
  }
}

// ---------------------------------------------------------------
// INIT
// ---------------------------------------------------------------
function jumpToToday() {
  if (!TRIP_START) return;
  const tripStart = new Date(TRIP_START);
  const diffDays = Math.floor((state.now - tripStart) / 86400000) + 1;
  if (diffDays >= 1 && diffDays <= DAYS.length) {
    state.activeDay = diffDays;
    state.activeTab = "itineraire";
  }
}

jumpToToday();
setInterval(() => { state.now = new Date(); render(); }, 60000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

render();
loadState();
loadWeather();
</script>
