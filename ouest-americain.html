  activeTab: "itineraire",
  activeDay: 1,
  checkedStops: {},

  customLinks: {},
  customPlaces: [],
  placeFilter: "Toutes",

  syncStatus: "idle",
  syncError: "",

};

let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }

function apiUrl(action) {
  return `${CONFIG.API_URL}?action=${action}&trip=${encodeURIComponent(CONFIG.TRIP_ID)}`;
}

async function loadState() {
  if (!CONFIG.API_URL) { state.isLoaded = true; state.syncStatus = "error"; state.syncError = "Aucune URL Apps Script configurée."; render(); return; }
  try {
    const res = await fetch(apiUrl("get"), { method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.checkedStops = data.checkedStops || {};
    state.checkedChecklist = data.checkedChecklist || {};
    state.customLinks = data.customLinks || {};
    state.customPlaces = data.customPlaces || [];
    state.isLoaded = true;
    state.syncStatus = "saved";
  } catch (err) {
    state.isLoaded = true;
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

async function saveState() {
  if (!CONFIG.API_URL) return;
  state.syncStatus = "saving";
  render();
  try {
    const res = await fetch(apiUrl("set"), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ checkedStops: state.checkedStops, checkedChecklist: state.checkedChecklist, customLinks: state.customLinks, customPlaces: state.customPlaces }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.syncStatus = data && data.ok ? "saved" : "error";
    state.syncError = data && data.ok ? "" : "Réponse inattendue du serveur.";
  } catch (err) {
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

function resetProgress() {
  state.checkedStops = {};
  state.checkedChecklist = {};
  saveState();
}

function addLink(key, prefill) {
  const existing = state.customLinks[key] || prefill || "";
  const url = window.prompt("Colle le lien de réservation :", existing);
  if (url === null) return;
  if (url.trim() === "") { delete state.customLinks[key]; } else { state.customLinks[key] = url.trim(); }
  render();
  scheduleSave();
}

function addPlace() {
  const name = window.prompt("Nom du lieu / resto :");
  if (!name || !name.trim()) return;
  const ville = window.prompt("Ville / étape :", "") || "";
  const note = window.prompt("Note (optionnel) :", "") || "";
  const link = window.prompt("Lien (optionnel) :", "") || "";
  state.customPlaces.push({ id:"cp"+Date.now(), name:name.trim(), ville:ville.trim(), note:note.trim(), link:link.trim() });
  render();
  scheduleSave();
}

function editPlace(id) {
  const p = state.customPlaces.find(x => x.id === id);
  if (!p) return;
  const name = window.prompt("Nom du lieu / resto :", p.name);
  if (name === null || !name.trim()) return;
  const ville = window.prompt("Ville / étape :", p.ville || "");
  if (ville === null) return;
  const note = window.prompt("Note (optionnel) :", p.note || "");
  if (note === null) return;
  const link = window.prompt("Lien (optionnel) :", p.link || "");
  if (link === null) return;
  p.name = name.trim(); p.ville = ville.trim(); p.note = note.trim(); p.link = link.trim();
  render();
  scheduleSave();
}

function deletePlace(id) {
  state.customPlaces = state.customPlaces.filter(p => p.id !== id);
  render();
  scheduleSave();
}

// ---------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------
function icon(name, size, extraClass) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${extraClass||''} shrink-0"></i>`;
}
function mapsLink(query) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`; }
function wazeLink(query) { return `https://www.waze.com/ul?q=${encodeURIComponent(query)}&navigate=yes`; }
function linkChip(href, label, iconName) {
  return `<a href="${href}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-1 rounded-full" style="background:#211C17;color:#F2ECE1" onclick="event.stopPropagation()">${icon(iconName,10)}${label}</a>`;
}

// ---------------------------------------------------------------
// EVENTS
// ---------------------------------------------------------------
function attachEvents() {
  document.querySelectorAll(".tab-btn").forEach(btn => { btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); }; });
  document.querySelectorAll(".day-btn").forEach(btn => { btn.onclick = () => { state.activeDay = Number(btn.dataset.day); render(); }; });
  document.querySelectorAll(".stop-btn").forEach(btn => {
    btn.onclick = () => { const key = btn.dataset.stop; state.checkedStops[key] = !state.checkedStops[key]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".check-btn").forEach(btn => {
    btn.onclick = () => { const id = btn.dataset.check; state.checkedChecklist[id] = !state.checkedChecklist[id]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".placefilter-btn").forEach(btn => {
    btn.onclick = () => { state.placeFilter = btn.dataset.placefilter; render(); };
  });
  document.querySelectorAll(".addlink-btn").forEach(btn => {
    btn.onclick = () => { addLink(btn.dataset.addlink, btn.dataset.prefill); };
  });
  document.querySelectorAll(".delplace-btn").forEach(btn => {
    btn.onclick = () => { deletePlace(btn.dataset.delplace); };
  });
  document.querySelectorAll(".editplace-btn").forEach(btn => {
    btn.onclick = () => { editPlace(btn.dataset.editplace); };
  });
  const addPlaceBtn = document.getElementById("btn-addplace");
  if (addPlaceBtn) addPlaceBtn.onclick = addPlace;
  const retryBtn = document.getElementById("btn-retry");
  if (retryBtn) retryBtn.onclick = saveState;
  const resetBtn = document.getElementById("btn-reset");
  if (resetBtn) resetBtn.onclick = resetProgress;
}
