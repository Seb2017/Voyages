  checkedStops: {},
  checkedChecklist: {},
  customLinks: {},
  placeFilter: "Toutes",
  isLoaded: false,
  syncStatus: "idle",
  syncError: "",
  now: new Date(),
};

let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }

function apiUrl(action) {
  return `${CONFIG.API_URL}?action=${action}&trip=${encodeURIComponent(CONFIG.TRIP_ID)}`;
}

async function loadState() {
  if (!CONFIG.API_URL) { state.isLoaded = true; state.syncStatus = "error"; state.syncError = "Aucune URL Apps Script configurée."; render(); return; }
  try {
    const res = await fetch(apiUrl("get"), { method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.checkedStops = data.checkedStops || {};
    state.checkedChecklist = data.checkedChecklist || {};
    state.customLinks = data.customLinks || {};
    state.isLoaded = true;
    state.syncStatus = "saved";
  } catch (err) {
    state.isLoaded = true;
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

async function saveState() {
  if (!CONFIG.API_URL) return;
  state.syncStatus = "saving";
  render();
  try {
    const res = await fetch(apiUrl("set"), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ checkedStops: state.checkedStops, checkedChecklist: state.checkedChecklist, customLinks: state.customLinks }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.syncStatus = data && data.ok ? "saved" : "error";
    state.syncError = data && data.ok ? "" : "Réponse inattendue du serveur.";
  } catch (err) {
    state.syncStatus = "error";
    state.syncError = err && err.message ? err.message : String(err);
  }
  render();
}

function resetProgress() {
  state.checkedStops = {};
  state.checkedChecklist = {};
  saveState();
}

function addLink(key, prefill) {
  const existing = state.customLinks[key] || prefill || "";
  const url = window.prompt("Colle le lien de réservation (GetYourGuide, etc.) :", existing);
  if (url === null) return; // annulé
  if (url.trim() === "") {
    delete state.customLinks[key];
  } else {
    state.customLinks[key] = url.trim();
  }
  render();
  scheduleSave();
}

function icon(name, size, extraClass) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${extraClass||''} shrink-0"></i>`;
}
function mapsLink(query) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
function wazeLink(query) {
  return `https://www.waze.com/ul?q=${encodeURIComponent(query)}&navigate=yes`;
}
function gygLink(query) {
  return `https://www.getyourguide.com/s/?q=${encodeURIComponent(query)}`;
}
function linkChip(href, label, iconName) {
  return `<a href="${href}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-1 rounded-full" style="background:#1C1712;color:#F1E9DC" onclick="event.stopPropagation()">${icon(iconName,10)}${label}</a>`;
}
function countdown() {
  const target = new Date("2026-09-15T21:55:00");
  const diffMs = target - state.now;
  if (diffMs <= 0) return { live: true };
  const days = Math.floor(diffMs / 86400000);
  return { live: false, days };
}

function attachEvents() {
  document.querySelectorAll(".tab-btn").forEach(btn => { btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); }; });
  document.querySelectorAll(".day-btn").forEach(btn => { btn.onclick = () => { state.activeDay = Number(btn.dataset.day); render(); }; });
  document.querySelectorAll(".stop-btn").forEach(btn => {
    btn.onclick = () => { const key = btn.dataset.stop; state.checkedStops[key] = !state.checkedStops[key]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".check-btn").forEach(btn => {
    btn.onclick = () => { const id = btn.dataset.check; state.checkedChecklist[id] = !state.checkedChecklist[id]; render(); scheduleSave(); };
  });
  document.querySelectorAll(".placefilter-btn").forEach(btn => {
    btn.onclick = () => { state.placeFilter = btn.dataset.placefilter; render(); };
  });
  document.querySelectorAll(".addlink-btn").forEach(btn => {
    btn.onclick = () => { addLink(btn.dataset.addlink, btn.dataset.prefill); };
  });
  const retryBtn = document.getElementById("btn-retry");
  if (retryBtn) retryBtn.onclick = saveState;
  const resetBtn = document.getElementById("btn-reset");
  if (resetBtn) resetBtn.onclick = resetProgress;
  const shareBtn = document.getElementById("btn-share");
  if (shareBtn) shareBtn.onclick = shareApp;
}

async function shareApp() {
  const shareData = {
    title: "Andalousie — Carnet de voyage",
    text: "Notre carnet de voyage en Andalousie",
    url: window.location.href,
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (err) { /* annulé par l'utilisateur */ }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(shareData.url);
      window.alert("Lien copié dans le presse-papier !");
    } catch (err) {
      window.prompt("Copie ce lien :", shareData.url);
    }
  } else {
    window.prompt("Copie ce lien :", shareData.url);
  }
}

function jumpToToday() {
  const tripStart = new Date("2026-09-15T00:00:00");
  const diffDays = Math.floor((state.now - tripStart) / 86400000) + 1;
  if (diffDays >= 1 && diffDays <= DAYS.length) {
    state.activeDay = diffDays;
    state.activeTab = "itineraire";
  }
}

jumpToToday();
setInterval(() => { state.now = new Date(); render(); }, 60000);
render();
loadState();
</script>
